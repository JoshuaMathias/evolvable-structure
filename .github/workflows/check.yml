name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-metrics:
    # Every recorded metric of this repository is offline (no paid service, no network), so every one of them runs on every change.
    # The arms that call a model are declared PAID and run only on a decision, never here.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "implementations/python[dev]"
      - run: python -m pytest implementations/python/tests
      # Structure findings are reports for the reader, not a gate: the step prints them and the job stays green.
      - run: esoi check || echo "::warning::esoi check reported structure findings, see the log above"
      - run: esoi hygiene
      # Recorded results must be current on the default branch: a result is stale once the measured code changed since its commit.
      - if: github.ref == 'refs/heads/main'
        run: esoi check --strict || echo "::warning::esoi check --strict reported stale results or structure findings, see the log above"
