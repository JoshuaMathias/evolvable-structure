[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esoi"
version = "0.1.0"
description = "Evolvable Structure that Optimizes Intent: records, checks, measured selection and a leaderboard for any repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Joshua Mathias" }]
keywords = ["architecture", "evaluation", "selection", "registry", "structure", "esoi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
sheets = ["google-api-python-client>=2.0", "google-auth>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
esoi = "esoi.cli:main"

[project.urls]
Homepage = "https://github.com/JoshuaMathias/evolvable-structure"
Issues = "https://github.com/JoshuaMathias/evolvable-structure/issues"

[tool.setuptools.packages.find]
include = ["esoi*"]

[tool.setuptools.package-data]
esoi = ["data/*.csv", "data/*.md"]
