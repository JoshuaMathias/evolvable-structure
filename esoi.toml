# esoi applied to this repository. The top intent (why this repository exists: ESOI itself) is held by esoi/; its
# sub-intents are the subfolders that carry their own intent.csv.
package = "esoi"
package_dir = "implementations/python/esoi"
python_path = ["implementations/python"]
# The bundled skill copy is text, not measured code: editing it must not stale every metric.
code_paths = ["implementations/python/esoi", ":(exclude)implementations/python/esoi/data", ":(exclude,glob)implementations/python/esoi/**/*.md",
              ":(exclude,glob)implementations/python/esoi/**/problems.csv", ":(exclude,glob)implementations/python/esoi/**/ideals.csv",
              ":(exclude,glob)implementations/python/esoi/**/solutions.csv", ":(exclude,glob)implementations/python/esoi/**/implementations.csv",
              ":(exclude,glob)implementations/python/esoi/**/metrics.csv", ":(exclude,glob)implementations/python/esoi/**/intent.csv",
              ":(exclude,glob)implementations/python/esoi/**/knowledge.csv"]
layers = ["core", "tools", "cli"]
structure_dir = "esoi"
evaluation_dir = "implementations/python/evaluation/components"
# The folder the evaluation components share their fixtures from: no metric, so not an evaluation folder of its own.
shared_eval_dirs = ["__pycache__", "shared_fixtures"]
# The intent template is read from the evolvable-structure skill's SKILL.md when ESOI_TEMPLATE_SOURCE (or --source)
# names it; the documents below are generated from it by `esoi template sync`.
templates_dir = "docs/reference/templates"
# The stamp of the skill and template this library follows, written by `esoi skill sync` and `esoi template sync`.
version_stamp = "implementations/python/esoi/data/skill_version.json"
excerpts_file = "docs/explanation/from-the-skill.md"
other_layers = ["docs", "evaluation", "examples", "scripts", "tests", "vendor", "prompts", "project"]

# The public copy of the author's skill is generated from his own skill folder (`esoi skill sync`, source from
# ESOI_SKILL_SOURCE or --source) and checked by `esoi skill check`. Only public file names are listed here; the list of
# private terms the check also rejects is never committed (ESOI_SKILL_DENYLIST).
[skill]
dir = "skill/evolvable-structure"
copies = ["implementations/python/esoi/data/skill/evolvable-structure"]
private_dirs = ["archive"]
include = [
  "SKILL.md", "INDEX.md", "steps.md", "python_tools.md", "principles.md", "principles/*.md", "coding.md",
  "coding/components.md", "coding/registry_and_templates.md", "coding/pipelines_and_experiments.md",
  "coding/writealyze.md", "coding/concept_ai_quest_qar.md", "other-categories.md",
  "sources/INDEX.md", "sources/public_research.md", "sources/components_research.md",
  "sources/definitions_and_advice.md", "sources/evolutionary_architecture_talk.md",
  "sources/trello_project_documentation.md", "sources/cantr_governance_proposals.md", "sources/agentic_frameworks.md",
]

[[skill.substitute]]
file = "SKILL.md"
pattern = " under \\S+ \\(it's only in the [^)]*? folder so that this user can access\\)"
replacement = ""
reason = "The sentence names the absolute folder of the author's private copy. In the installed skill, 'this skill's folder' is the folder it is installed in."

# Pages outside docs/ the generated wiki carries (README.md links the steps page, whose source is the skill's steps.md).
[docs]
wiki_extra = ["skill/evolvable-structure/steps.md"]

[hygiene]
# The author's public commit identity.
allow_mailboxes = ["joshuamonkey"]

[records]
# This repository keeps each solution's records beside its code (docs/reference/records-beside-code.md): the package folder holds the
# root and the four containers, and each container (understanding, structure, optimization, runtime) is a sub-intent with its own
# intent.csv whose solutions sit in the folders of their code, up to three levels below the package (container, solution, part of a solution).
beside_code = ["implementations/python/esoi", "implementations/python/esoi/*", "implementations/python/esoi/*/*", "implementations/python/esoi/*/*/*"]
# The version of the intent template this repository's own records follow (`esoi version --record`).
template_version = 5

# Opt-in rules, advisory: `esoi check --findings` lists what they find; none of it fails a check.
[rules.S36]
enabled = true

[rules.S37]
enabled = true

# Solution coherence (rule S38): floors per intent, the strong-evidence share of checkable uses edges (precision) and the checkable
# share of all edges (coverage). A floor is a measurement: each is what `python3 -m esoi.structure.structure_check.coherence` reports now,
# and rises when a composition is typed in code; it is never set above a measurement. The root and Understanding reach 1.0 because
# each edge is named in the code that uses it. In Structure, Optimization and Runtime the edges below a second-level solution (a
# registry that composes its template sync, a harness that composes its decision of when to run) are recorded in the selected
# implementation's `uses_solution_ids` while the interface modules do not yet import or type the used solution, so only a third
# of the evidence is strong there (docs/explanation/why-prose-is-not-code-evidence.md lists the kinds of evidence).
[rules.S38]
enabled = true
min_lift = 1.0

[rules.S38.floors.esoi]
precision = 1.0
coverage = 1.0

[rules.S38.floors.understanding]
precision = 1.0
coverage = 1.0

[rules.S38.floors.structure]
precision = 0.429
coverage = 1.0

[rules.S38.floors.optimization]
precision = 0.4
coverage = 1.0

[rules.S38.floors.runtime]
precision = 0.75
coverage = 1.0

[rules.S39]
enabled = true

# The balanced score of the structure-quality scorer's cases, fixed before any arm was scored (rule S44). Accuracy is the share of cases an arm gets
# right; the arms are free and fast, so cost and time carry little. The seven dimension weights of the number a scorer reports for a project are in
# implementations/python/esoi/structure/structure_quality/balance.py and in the metric record.
[balance.score_structure_quality]
weights = { accuracy = 0.7, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.05
seconds_per_case = 10

# Structure Quality's advisory rules, one per dimension of its balanced number (docs/how-to/measure-structure-quality.md).
[rules.S54]
enabled = true

[rules.S55]
enabled = true

[rules.S56]
enabled = true

[rules.S57]
enabled = true

[rules.S58]
enabled = true

[rules.S59]
enabled = true

# The balanced score of Solution Relevance (classifying a request into the solutions it concerns). Accuracy is the share of cases where every
# gold solution was returned and at least a quarter of the chosen ones were gold, so recall counts most and precision is a floor. One
# classification runs before each fan-out, so it is worth at most a fifth of a cent and two seconds. Fixed before any arm was scored.
[balance.solution_relevance]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.002
seconds_per_case = 2

# The balanced score of Solution Consideration (the prompt of one solution). One prompt is assembled per pass, so it is worth at most a
# cent and five seconds before the pass itself. Fixed before any arm was scored.
[balance.solution_consideration]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.01
seconds_per_case = 5

# USD per million tokens of the cheap tier the paid arms of Solution Consideration and Solution Relevance call (list price as recorded
# by an adopting hub's tier price registry from the vendor's pricing page, checked 2026-10-30). The command provider estimates tokens
# at four characters each.
[prices.claude-haiku-5-5]
input = 0.10
output = 0.50
