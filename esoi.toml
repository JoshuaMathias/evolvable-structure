# esoi applied to this repository. The top intent (why this repository exists: ESOI itself) is held by esoi/; its
# sub-intents are the subfolders that carry their own intent.csv.
package = "esoi"
package_dir = "implementations/python/esoi"
python_path = ["implementations/python"]
# The bundled skill copy is text, not measured code: editing it must not stale every metric.
code_paths = ["implementations/python/esoi", ":(exclude)implementations/python/esoi/data", ":(exclude,glob)implementations/python/esoi/**/*.md",
              ":(exclude,glob)implementations/python/esoi/**/problems.csv", ":(exclude,glob)implementations/python/esoi/**/ideals.csv",
              ":(exclude,glob)implementations/python/esoi/**/solutions.csv", ":(exclude,glob)implementations/python/esoi/**/implementations.csv",
              ":(exclude,glob)implementations/python/esoi/**/metrics.csv", ":(exclude,glob)implementations/python/esoi/**/intent.csv"]
layers = ["core", "tools", "cli"]
structure_dir = "esoi"
evaluation_dir = "implementations/python/evaluation/components"
# The intent template is read from the evolvable-structure skill's SKILL.md when ESOI_TEMPLATE_SOURCE (or --source)
# names it; the documents below are generated from it by `esoi template sync`.
templates_dir = "docs/reference/templates"
# The stamp of the skill and template this library follows, written by `esoi skill sync` and `esoi template sync`.
version_stamp = "implementations/python/esoi/data/skill_version.json"
excerpts_file = "docs/explanation/from-the-skill.md"
other_layers = ["docs", "evaluation", "examples", "scripts", "tests", "vendor", "prompts", "project"]

# The public copy of the author's skill is generated from his own skill folder (`esoi skill sync`, source from
# ESOI_SKILL_SOURCE or --source) and checked by `esoi skill check`. Only public file names are listed here; the list of
# private terms the check also rejects is never committed (ESOI_SKILL_DENYLIST).
[skill]
dir = "skill/evolvable-structure"
copies = ["implementations/python/esoi/data/skill/evolvable-structure"]
private_dirs = ["archive"]
include = [
  "SKILL.md", "INDEX.md", "steps.md", "python_tools.md", "principles.md", "principles/*.md", "coding.md",
  "coding/components.md", "coding/registry_and_templates.md", "coding/pipelines_and_experiments.md",
  "coding/writealyze.md", "coding/concept_ai_quest_qar.md", "other-categories.md",
  "sources/INDEX.md", "sources/public_research.md", "sources/components_research.md",
  "sources/definitions_and_advice.md", "sources/evolutionary_architecture_talk.md",
  "sources/trello_project_documentation.md", "sources/cantr_governance_proposals.md", "sources/agentic_frameworks.md",
]

[[skill.substitute]]
file = "SKILL.md"
pattern = " under \\S+ \\(it's only in the [^)]*? folder so that this user can access\\)"
replacement = ""
reason = "The sentence names the absolute folder of the author's private copy. In the installed skill, 'this skill's folder' is the folder it is installed in."

[hygiene]
# The author's public commit identity.
allow_mailboxes = ["joshuamonkey"]

[records]
# This repository keeps each solution's records beside its code (docs/reference/records-beside-code.md): the package folder holds the
# solutions of the code it holds, and esoi-runtime, a sub-intent, sits there beside the code it arises from.
beside_code = ["implementations/python/esoi", "implementations/python/esoi/*"]
# The version of the intent template this repository's own records follow (`esoi version --record`).
template_version = 4

# Opt-in rules, advisory: `esoi check --findings` lists what they find; none of it fails a check.
[rules.S36]
enabled = true

[rules.S37]
enabled = true

# Solution coherence (rule S38): floors per intent, the strong-evidence share of checkable uses edges (precision) and the checkable
# share of all edges (coverage). A floor is a measurement: each is what `python3 -m esoi.coherence` reports now, and rises when a
# composition is typed in code; it is never set above a measurement. Earlier floors of 1.0 were measured when every solution in
# interfaces.py counted as named by every other one (881 of 1079 non-edges showed the same evidence, lift 1.14); evidence is now
# attributed per solution, so they are lowered to what the code shows: the records state a composition of documents, commands and
# judges (the-standard, esoi-for-ai, the-steps, structure-budget and the rest) that the one-fact probes in interfaces.py do not call,
# and 29 of the 40 recorded edges are seen (E5 sees seven document edges through the `documents` column of components.csv) (docs/explanation/why-prose-is-not-code-evidence.md lists the rest and why).
[rules.S38]
enabled = true

[rules.S38.floors.esoi]
precision = 0.725
coverage = 1.0

# The sub-intent's two edges are runtime-selection and assemble-by-name composing in assemble.py, runtime.py and lock.py, while the
# implementation records name interfaces.py (the declared arm), whose lazy import reaches them only through entry.py, a module
# several solutions own. No strong evidence is shown, so the lift is 0.0 as well; both stay until the arms import their modules.
[rules.S38.floors.esoi-runtime]
precision = 0.0
coverage = 1.0
min_lift = 0.0

[rules.S39]
enabled = true
